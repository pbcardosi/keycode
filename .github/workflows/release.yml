name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run pack:smoke
      - run: mkdir -p artifacts && npm pack --pack-destination artifacts
      - run: node scripts/checksums.mjs artifacts
      - run: gh release create "${GITHUB_REF_NAME}" artifacts/*.tgz artifacts/SHA256SUMS --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
